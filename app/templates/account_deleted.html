{% extends "base.html" %}
{% block title %}Account deleted - {{ site_name }}{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg px-4 py-12 text-center">
  <div class="rounded-xl border border-green-300 bg-green-50 p-8 dark:border-green-800 dark:bg-green-950">
    <h1 class="text-2xl font-bold text-green-900 dark:text-green-100">Account deleted</h1>
